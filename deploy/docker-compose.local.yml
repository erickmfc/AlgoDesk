services:
  dashboard:
    # Serve the Linux image build; host node_modules cannot be mounted into
    # Alpine because native frontend bindings are platform-specific.
    command: npm run start
  api:
    volumes:
      - ./configs:/app/configs:ro
    environment:
      - APPLICATION_ROLE=api
      - APP_PORT=8000
      - RUN_MIGRATIONS=false
      - TRADER_INTERNAL_URL=http://trader:8001
      - DATABASE_URL=postgresql+psycopg://algodesk:algodesk@postgres:5432/algodesk
  trader:
    volumes:
      - ./configs:/app/configs:ro
    environment:
      - APPLICATION_ROLE=trader
      - APP_PORT=8001
      - RUN_MIGRATIONS=true
      - TRADING_MODE=paper
      - LIVE_TRADING_ENABLED=false
      - DATABASE_URL=postgresql+psycopg://algodesk:algodesk@postgres:5432/algodesk
