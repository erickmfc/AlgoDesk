services:
  dashboard:
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - .:/app
      - algodesk_node_modules:/app/node_modules
  api:
    environment:
      - APPLICATION_ROLE=api
      - APP_PORT=8000
      - RUN_MIGRATIONS=false
      - TRADER_INTERNAL_URL=http://trader:8001
      - DATABASE_URL=postgresql+psycopg://algodesk:algodesk@postgres:5432/algodesk
  trader:
    environment:
      - APPLICATION_ROLE=trader
      - APP_PORT=8001
      - RUN_MIGRATIONS=true
      - TRADING_MODE=paper
      - LIVE_TRADING_ENABLED=false
      - DATABASE_URL=postgresql+psycopg://algodesk:algodesk@postgres:5432/algodesk

volumes:
  algodesk_node_modules:
