services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algodesk
      POSTGRES_USER: algodesk
      POSTGRES_PASSWORD: algodesk
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algodesk -d algodesk"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  dashboard:
    build: .
    ports:
      - "4173:4173"
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      trader:
        condition: service_healthy
  trader:
    build: ./apps/trader
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
