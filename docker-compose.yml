services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algodesk
      POSTGRES_USER: algodesk
      POSTGRES_PASSWORD: algodesk
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algodesk -d algodesk"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  dashboard:
    build: .
    ports:
      - "4173:4173"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      api:
        condition: service_healthy
  api:
    build: ./apps/trader
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APPLICATION_ROLE=api
      - APP_PORT=8000
      - RUN_MIGRATIONS=false
      - TRADER_INTERNAL_URL=http://trader:8001
      - DATABASE_URL=postgresql+psycopg://algodesk:algodesk@postgres:5432/algodesk
    depends_on:
      postgres:
        condition: service_healthy
      trader:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  trader:
    build: ./apps/trader
    env_file:
      - .env
    environment:
      - APPLICATION_ROLE=trader
      - APP_PORT=8001
      - RUN_MIGRATIONS=true
      - DATABASE_URL=postgresql+psycopg://algodesk:algodesk@postgres:5432/algodesk
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
